<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#102b4e" />
    <title>Original PDF — Office-Based Emergency Manual</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
        background: #eef7ff;
        font-family: Arial, sans-serif;
      }
      .pdf-toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 9px 12px;
        border-bottom: 1px solid #bfd0e4;
        background: #eef7ff;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 9px 14px;
        border-radius: 8px;
        background: #0f47a1;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
      .pdf-title { color: #102b4e; font-weight: 800; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <header class="pdf-toolbar">
      <a class="back-link" href="./index.html#route=manual">‹ Back to app</a>
      <span class="pdf-title">Original PDF Manual</span>
    </header>
    <iframe src="./assets/office-based-emergency-manual.pdf" title="Office-Based Emergency Manual PDF"></iframe>
  </body>
</html>
