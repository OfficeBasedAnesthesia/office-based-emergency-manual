<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emergency Manual — Phone Preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #dfe7f1;
        font-family: Arial, sans-serif;
      }
      .phone {
        width: 390px;
        height: min(844px, calc(100vh - 24px));
        overflow: hidden;
        border: 10px solid #17243a;
        border-radius: 34px;
        background: white;
        box-shadow: 0 18px 55px rgba(23, 36, 58, 0.28);
      }
      iframe { width: 100%; height: 100%; border: 0; background: white; }
    </style>
  </head>
  <body>
    <main class="phone" aria-label="Phone preview">
      <iframe
        title="Emergency Manual phone app preview"
        src="./index.html#route=home&amp;category=critical-events&amp;case=allergies-anaphylaxis"
      ></iframe>
    </main>
  </body>
</html>
